[project]
name = "pythonproject"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.136.3",
    "jinja2>=3.1",
    "langgraph>=0.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.50",
    "uvicorn>=0.32",
    # ── 基础设施依赖 ──
    "asyncpg>=0.30",
    "minio>=7.2",
    "pymilvus>=2.4",
    "elasticsearch>=8.15,<9",
    "redis>=5.0",
    "langgraph-checkpoint-postgres>=2.0",
    "aiohttp>=3.13.5",
    "celery>=5.4",
    "pypdf>=6.12.2",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "psycopg[binary]>=3.2",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: 纯函数、schema、状态机等无外部依赖测试",
    "service: 使用 fake adapter 的 service 层集成测试",
    "api: FastAPI TestClient API 测试",
    "integration: 依赖 Docker（PostgreSQL / Redis / Milvus 等）的集成测试",
    "e2e: 端到端测试",
]
addopts = [
    "-m", "not integration and not e2e",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.coverage.run]
source = ["app"]
omit = [
    "app/main.py",
    "app/api/dependencies.py",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
